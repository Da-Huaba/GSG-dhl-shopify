name: Keepalive
# GitHub deaktiviert geplante Workflows in öffentlichen Repos nach 60 Tagen
# ohne Repo-Aktivität (so am 28.08. und 20.10.2026 passiert: Retouren blieben
# liegen). Dieser Job committet zweimal im Monat einen Zeitstempel und
# schaltet die geplanten Workflows vorsorglich wieder ein.
on:
  schedule:
    - cron: '17 4 1,15 * *'     # 1. und 15. des Monats, ~06:17 Berlin
  workflow_dispatch: {}
permissions:
  contents: write   # Commit des Zeitstempels
  actions: write    # gh workflow enable
concurrency: { group: keepalive, cancel-in-progress: false }
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zeitstempel committen
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m "keepalive $(date -u +%Y-%m-%d)"
          git push
      - name: Geplante Workflows einschalten
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for wf in returns-poller.yml tracking-sync.yml keepalive.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || echo "::warning::$wf nicht eingeschaltet"
          done
